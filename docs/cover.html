.rule{width:92px;height:4px;background:#d9c07a;border-radius:2px;margin:34px 0 28px}
.tags{display:flex;flex-wrap:wrap;gap:10px;max-width:680px}

.shot{position:absolute;right:-52px;top:110px;width:900px;z-index:1}
.browser{background:#f7f4ea;border-radius:18px;padding:10px;box-shadow:0 38px 110px rgba(0,0,0,.45);transform:rotate(-2.2deg)}
.bar{height:24px;display:flex;align-items:center;gap:6px;padding-left:6px}
.bar i{width:7px;height:7px;border-radius:50%;background:#c9c2ae;display:block}
.bar .url{margin-left:12px;height:14px;flex:1;border-radius:7px;background:#e9e4d6}
.browser img{display:block;width:100%;height:520px;object-fit:cover;object-position:top left;border-radius:8px}

.badge b{display:block;font-size:26px;line-height:1.2}
.badge span{display:block;font-size:11px;letter-spacing:.12em;margin-top:5px;color:#3d5237}
